<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SatNOGS station dashboard</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script type="importmap">
{ "imports": { "satellite.js": "https://cdn.jsdelivr.net/npm/satellite.js@7.1.0/+esm" } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --panel:   rgba(10,15,22,.82);
    --line:    #232c3a;
    --line-2:  #1a2230;
    --ink:     #e8eef6;
    --muted:   #8b97a8;
    --future:  #59a7ff;
    --good:    #2ee56a;
    --bad:     #ff5252;
    --failed:  #8e98a6;
    --unknown: #f8a315;
    --run:     #ffe84d;
  }
  html, body { margin:0; height:100%; background:#04070c; color:var(--ink);
               font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #cesiumContainer { position:absolute; inset:0; }

  /* ---- panel ------------------------------------------------------- */
  #panel { position:absolute; top:12px; left:12px; width:372px;
           display:flex; flex-direction:column; z-index:10;
           background:var(--panel); border:1px solid var(--line);
           border-radius:12px; padding:12px 6px 9px 14px; font-size:12px;
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           box-shadow:0 10px 30px rgba(0,0,0,.45); }
  #panel h1 { font-family:'Chakra Petch', 'Helvetica Neue', sans-serif;
              font-size:15px; font-weight:600; letter-spacing:.8px;
              text-transform:uppercase; margin:0 8px 8px 0; color:#fff;
              display:flex; justify-content:space-between; align-items:baseline; }
  #clock { font-family: ui-monospace, Menlo, monospace; font-size:12px;
           font-weight:400; color:var(--muted); letter-spacing:0; text-transform:none; }
  #age { font-family: ui-monospace, Menlo, monospace; font-size:10.5px;
         font-weight:400; letter-spacing:0; text-transform:none;
         color:var(--muted); margin-left:auto; padding-left:10px; }
  #age.stale { color:var(--unknown); }
  #age.err   { color:var(--bad); }

  #agewrap { display:flex; justify-content:flex-end; margin:-4px 8px 6px 0; }
  #chips { display:flex; gap:8px; margin:0 8px 10px 0; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:6px; padding:4px 9px 4px 7px;
          border:1px solid var(--line); border-radius:999px;
          background:rgba(255,255,255,.03); }
  .chip b { color:#fff; font-weight:600; }
  .chip .st { color:var(--muted); }

  .dish { width:13px; height:13px; flex:none; }
  .st-online  { color:var(--good); }
  .st-testing { color:var(--unknown); }
  .st-offline     { color:var(--bad); }
  .st-unavailable { color:var(--failed); }
  .future  { color:var(--future); }
  .good    { color:var(--good); }
  .bad     { color:var(--bad); }
  .failed  { color:var(--failed); }
  .unknown { color:var(--unknown); }

  /* ---- observation list (kept short so it never covers the widgets) - */
  #obswrap { overflow-y:auto; overflow-x:hidden; padding-right:8px;
             max-height:min(34vh, 340px);
             border-top:1px solid var(--line-2); }
  #obswrap::-webkit-scrollbar { width:8px; }
  #obswrap::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }

  table { width:100%; border-collapse:collapse; }
  td { padding:6px 3px 5px; border-bottom:1px solid var(--line-2); vertical-align:top; }
  tr[data-id] { cursor:pointer; position:relative; }
  tr[data-id]:hover { background:rgba(127,178,255,.07); }
  tr.done { opacity:.45; }
  tr.now { background:rgba(255,232,77,.08); }
  tr.now td:first-child { box-shadow: inset 3px 0 0 var(--run); }
  tr.now .dish { color:var(--run); filter:drop-shadow(0 0 4px rgba(255,232,77,.9)); }
  .prog { display:none; height:2px; background:var(--run); border-radius:1px;
          margin-top:4px; width:0%; }
  tr.now .prog { display:block; }

  a { color:#7fb2ff; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .sat { color:#fff; }
  .meta { color:var(--muted); }
  .band { display:inline-block; font-size:10px; font-weight:600; letter-spacing:.5px;
          padding:0 5px; border-radius:4px; border:1px solid var(--line);
          color:var(--muted); margin-left:6px; vertical-align:1px; }
  .empty { color:var(--muted); padding:8px 3px; }

  #listctl { display:none; margin:0 8px 8px 0; }
  #expand { width:100%; appearance:none; cursor:pointer;
            font:inherit; font-size:11px; color:var(--muted);
            background:rgba(255,255,255,.03); border:1px solid var(--line);
            border-radius:8px; padding:7px 10px; }
  #expand:active { background:rgba(255,255,255,.07); }

  #legend { display:flex; gap:11px; flex-wrap:wrap; margin:8px 8px 0 0;
            padding-top:7px; border-top:1px solid var(--line-2);
            color:var(--muted); font-size:10.5px; }
  #legend span { display:flex; align-items:center; gap:4px; }
  #legend .dish { width:11px; height:11px; }
  #legend .run { color:var(--run); }

  /* ---- cesium widget restyle --------------------------------------- */
  .cesium-viewer-bottom { display:none; }
  .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer { opacity:.9; }
  .cesium-timeline-main { border:1px solid var(--line); }
  .cesium-widget-credits { display:none !important; }

  /* ---- splash ------------------------------------------------------ */
  #splash { position:absolute; inset:0; z-index:50; background:#04070c;
            display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:14px; transition:opacity .5s ease; }
  #splash.gone { opacity:0; pointer-events:none; }
  #splash-logo { width:112px; height:112px; object-fit:contain; }
  #splash-title { font-family:'Chakra Petch','Helvetica Neue',sans-serif;
                  font-size:14px; font-weight:600; letter-spacing:1.2px;
                  text-transform:uppercase; color:#fff; text-align:center;
                  padding:0 24px; }
  #splash-bar { width:220px; max-width:60vw; height:3px; background:var(--line);
                border-radius:2px; overflow:hidden; }
  #splash-fill { height:100%; width:4%; background:var(--run);
                 transition:width .35s ease; }
  #splash-step { font-size:11px; color:var(--muted); }

  /* ---- narrow screens ---------------------------------------------- */
  @media (max-width: 720px) {
    #panel { left:8px; right:8px; top:8px; width:auto; font-size:11px;
             padding:10px 4px 8px 10px; }
    #panel h1 { font-size:12.5px; flex-wrap:wrap; }
    #chips { gap:6px; }
    .chip { padding:3px 7px 3px 6px; }
    #obswrap { max-height:min(26vh, 200px); }
    #legend { gap:8px; font-size:9.5px; }
    .cesium-viewer-animationContainer { transform:scale(.78);
                                        transform-origin:bottom left; }
    #listctl { display:block; }
    #panel h1 { flex-wrap:nowrap; gap:8px; }
    #title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #clock { flex:none; }
    .chip { font-size:10px; }
    /* collapsed: the pass under way, or the next one if nothing is running */
    #panel:not(.open) #obs tr[data-id]:not(.now):not(.next) { display:none; }
    /* one line per row: the transmitter and the legend are detail for the
       expanded view */
    #panel:not(.open) #obs td { padding:4px 3px; }
    #panel:not(.open) #obs td:nth-child(2) > .meta { display:none; }
    #panel:not(.open) #obs .sat { display:inline-block; max-width:170px;
                                  overflow:hidden; text-overflow:ellipsis;
                                  white-space:nowrap; vertical-align:bottom; }
    #panel:not(.open) #legend { display:none; }
    #panel:not(.open) #obswrap { max-height:118px; }
    #splash-logo { width:84px; height:84px; }
  }
  @media (max-height: 520px) {
    #obswrap { max-height:22vh; }
  }
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<div id="splash">
  <img id="splash-logo" src="logo.svg" alt="">
  <div id="splash-title">SatNOGS station dashboard</div>
  <div id="splash-bar"><div id="splash-fill"></div></div>
  <div id="splash-step">starting</div>
</div>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="dishglyph" viewBox="0 0 48 48">
    <g fill="currentColor">
      <ellipse cx="19" cy="23" rx="8.5" ry="15" transform="rotate(45 19 23)"/>
      <rect x="18" y="21.4" width="16" height="2.6" rx="1.3" transform="rotate(-45 18 22.7)"/>
      <circle cx="31.5" cy="10.5" r="3.2"/>
      <rect x="20.5" y="29" width="3.2" height="14"/>
      <rect x="13" y="42" width="18" height="3.6" rx="1.6"/>
    </g>
  </symbol>
</svg>

<div id="panel">
  <h1><span id="title">loading&hellip;</span> <span id="clock">--:--:--Z</span></h1>
  <div id="agewrap"><span id="age">connecting&hellip;</span></div>
  <div id="chips"></div>
  <div id="listctl"><button id="expand" type="button">show all passes</button></div>
  <div id="obswrap"><table id="obs"></table></div>
  <div id="legend">
    <span><svg class="dish future"><use href="#dishglyph"/></svg>future</span>
    <span><svg class="dish run"><use href="#dishglyph"/></svg>running</span>
    <span><svg class="dish good"><use href="#dishglyph"/></svg>good</span>
    <span><svg class="dish bad"><use href="#dishglyph"/></svg>bad</span>
    <span><svg class="dish failed"><use href="#dishglyph"/></svg>failed</span>
    <span><svg class="dish unknown"><use href="#dishglyph"/></svg>unknown</span>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
